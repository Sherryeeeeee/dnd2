services:
  - type: web
    name: seventh-dungeon-master
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_DM_MODEL
        value: gpt-4o-mini
      - key: TTS_PROVIDER
        value: doubao
      - key: VOLCENGINE_TTS_API_KEY
        sync: false
      - key: VOLCENGINE_TTS_RESOURCE_ID
        value: seed-tts-2.0
      - key: VOLCENGINE_TTS_SPEAKER
        value: zh_female_sophie_uranus_bigtts
